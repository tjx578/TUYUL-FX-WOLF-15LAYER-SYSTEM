version: "1.0.0"
name: "Wolf15 SignalThrottle Golden Pattern Database"
scope: "analysis_layer_only"
authority_note: "Pattern metadata enriches analysis only; final verdict remains Constitution/L12."
core_principle: >
  SignalThrottle is pressure radar, Microboost is lifecycle priority,
  Allowed is provisional direction, and final direction still requires phase,
  theme, price context, risk, and tradeplan readiness.
storage_model:
  pattern_scope: UNIVERSAL
  golden_reference_semantics: historical evidence source only, not pair ownership
  pair_role_map_semantics: calibration and prioritization only, not exclusivity
  applies_to: ALL_PAIRS_IF_CONDITIONS_MATCH


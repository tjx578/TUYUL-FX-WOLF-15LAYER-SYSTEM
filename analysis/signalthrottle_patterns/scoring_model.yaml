scoring_model:
  max_score: 100
  fields:
    pattern_match_score:
      purpose: historical_pattern_recognition_strength
      includes: [pair_role, strategy_pattern, pressure_block, microboost_stage, price_location, density, duration]
      note: Tier-S patterns may score high here even when execution is blocked.
    execution_readiness_score:
      purpose: current_execution_context_readiness
      starts_from: pattern_match_score
      subtracts: [spread_penalty, theme_conflict_penalty, no_trade_permission, no_chase_permission, sparse_archive_penalty]
      note: This is the backward-compatible `pattern_score`.
    pattern_score:
      purpose: backward_compatible_readiness_score
      alias_of: execution_readiness_score
  tier_weights:
    S+: 55
    S: 50
    S-: 45
    A+: 40
    A: 35
    A-: 30
    B+: 25
    B: 20
    B-: 15
  weights:
    pressure_block: 20
    microboost: 10
    allowed_quorum: 10
    theme_basket: 20
    mtf_phase: 20
    price_location: 15
    lifecycle_stage: 15
  penalties:
    exhaustion_penalty: -30
    counterflow_penalty: -30
    late_chase_penalty: -25
    theme_conflict_penalty: -35
    incomplete_tradeplan_penalty: -40
    sparse_archive_penalty: -50
  interpretation:
    "90-100": GOLDEN_A_PLUS
    "80-89": A_VALID
    "70-79": B_PLUS_WATCH
    "60-69": CONTEXTUAL_WATCH
    "40-59": LOW_PRIORITY
    "0-39": ARCHIVE_OR_BLOCK

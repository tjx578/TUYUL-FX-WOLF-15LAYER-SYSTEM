pair_role_map:
  GBPCAD:
    default_role: PRIMARY_TIMING_CAD_WEAKNESS
    golden_patterns:
      - OPEN_LANE_TIMING_VALID
      - LOW_DENSITY_OPEN_LANE_TIMING_BLOCK
      - ZERO_DRAWDOWN_FOLLOWTHROUGH
      - PRE_IGNITION_COUNTERFLOW_TRAP
      - FALSE_COUNTERFLOW_CANARY
      - ALLOWED_CANARY_QUORUM
      - HIGH_DENSITY_ACCELERATION
      - HIGH_DENSITY_ACCELERATION_CONTINUATION
      - LATE_DENSE_CONGESTION
      - LATE_DENSE_PRESSURE_MANAGEMENT_ALERT
      - LATE_MICROBOOST_DECISION_POINT
  EURCAD:
    default_role: DELAYED_IGNITION_CAD_WEAKNESS
    golden_patterns:
      - DELAYED_IGNITION_MICROBOOST
      - LATE_UPPER_MICROBOOST
  AUDCAD:
    default_role: LATE_SATURATION_CAD_WEAKNESS
    golden_patterns:
      - LATE_UPPER_MICROBOOST
      - SATURATION_MICROBOOST_WARNING
  NZDCAD:
    default_role: SECONDARY_CONFIRMATION_CAD_WEAKNESS
    golden_patterns:
      - SECONDARY_OPEN_LANE_CONFIRMATION
      - LATE_SECONDARY_SATURATION
      - CONFIRMATION_PAIR_NOT_PRIMARY_ENTRY
  CADCHF:
    default_role: CLEAN_INVERSE_CONFIRMATION_CAD_WEAKNESS
    golden_patterns:
      - INVERSE_MIRROR_BREAKDOWN
      - INVERSE_COOLING_PAUSE
      - CONFIRMATION_PAIR_NOT_PRIMARY_ENTRY
  CADJPY:
    default_role: JPY_SENSITIVE_INVERSE_CONFIRMATION
    golden_patterns:
      - EARLY_INVERSE_OPEN_LANE_CONFIRMATION
      - DELAYED_INVERSE_IGNITION
      - INVERSE_MIRROR_BREAKDOWN_CONFIRMATION
      - LOWER_RANGE_NO_CHASE_FILTER
      - INVERSE_LATE_SELL_TRAP
      - CLEAN_BLOCK_BUT_THEME_CONFLICT
      - JPY_ALIGNMENT_REQUIRED
  EURJPY:
    default_role: JPY_BASKET_GOLDEN_REFERENCE
    golden_patterns:
      - LIQUIDATION_RECLAIM_REQUIRED
      - THEME_CONTEXT_ONLY_NOT_STANDALONE
      - MID_RANGE_CONTINUATION_PULLBACK_REQUIRED
      - TIMING_VALID_NOT_FINAL
      - BASKET_THEME_CONFIRMATION_CONTEXT
      - JPY_ALIGNMENT_REQUIRED
  USDJPY:
    default_role: PHASE_SENSITIVE_JPY_MAJOR
    golden_patterns:
      - PHASE_SENSITIVE_BREAKDOWN
      - UPPER_ABSORPTION_WARNING
      - LIQUIDATION_EXPANSION
      - SPARSE_ARCHIVE
      - LOWER_RANGE_NO_CHASE_FILTER
      - LATE_DENSE_PRESSURE_MANAGEMENT_ALERT
      - SIGNAL_LIFECYCLE_CONFLICT_WATCH
      - JPY_ALIGNMENT_REQUIRED
  GBPJPY:
    default_role: PHASE_SENSITIVE_JPY_CROSS
    golden_patterns:
      - MICROBURST_FOLLOWTHROUGH_RECLAIM
      - CLEAN_5M_TIMING_GATE_NOT_FINAL
      - HIGH_DENSITY_ACCELERATION_CONTINUATION
      - HIGH_DENSITY_CONTEXT_FILTER_NO_CHASE
      - TIMING_VALID_NOT_FINAL
      - BASKET_THEME_CONFIRMATION_CONTEXT
      - JPY_ALIGNMENT_REQUIRED
  AUDJPY:
    default_role: JPY_WEAKNESS_CONFIRMATION_CROSS
    golden_patterns:
      - OPEN_LANE_TIMING_VALID
      - MICROBURST_FOLLOWTHROUGH_RECLAIM
      - HIGH_DENSITY_ACCELERATION_CONTINUATION
      - HIGH_DENSITY_CONTEXT_FILTER_NO_CHASE
      - TIMING_VALID_NOT_FINAL
      - BASKET_THEME_CONFIRMATION_CONTEXT
      - JPY_ALIGNMENT_REQUIRED
  NZDCHF:
    default_role: CHF_CROSS_PHASE_SENSITIVE
    golden_patterns:
      - BEARISH_OR_BULLISH_CONTINUATION_AFTER_HOT_BLOCK
      - COUNTER_RECLAIM_WATCH_NOT_REVERSAL_FINAL
      - REPEATED_PRESSURE_MANAGEMENT_ALERT
  EURCHF:
    default_role: CHF_WEAKNESS_MICROBOOST_CROSS
    golden_patterns:
      - COUNTER_RECLAIM_WATCH_NOT_REVERSAL_FINAL
      - DELAYED_FOLLOWTHROUGH_WATCH
      - HIGH_DENSITY_ACCELERATION_CONTINUATION
      - HIGH_DENSITY_CONTEXT_FILTER_NO_CHASE
      - BASKET_THEME_CONFIRMATION_CONTEXT
  EURUSD:
    default_role: MAJOR_CONTEXT_PAIR
    golden_patterns:
      - MAJOR_PAIR_DELAYED_CONTINUATION
      - PULLBACK_WITHIN_H4_EXPANSION
  GBPNZD:
    default_role: TAKEOVER_CONTEXTUAL_CROSS
    golden_patterns:
      - SAME_PAIR_TAKEOVER
      - SAME_PAIR_TAKEOVER_GRIND
      - TAKEOVER_TO_LATE_REVERSAL
      - CHOPPY_TAKEOVER_CONTINUATION
      - DAILY_CONFLICT_AFTER_INTRADAY_TAKEOVER
  USDCAD:
    default_role: MACRO_ANCHOR_AND_SIGNALWATCH_LIFECYCLE
    golden_patterns:
      - SLOW_ACTIVE_SIGNAL_SEED
      - SIGNALWATCH_LIFECYCLE_FINALIZER
      - ABSORPTION_WATCH_FAILED
      - HIGH_DENSITY_ABSORPTION_WITH_RECLAIM
      - SIGNAL_LIFECYCLE_CONFLICT_WATCH
  XAUUSD:
    default_role: METAL_VOLATILITY_LIFECYCLE
    golden_patterns:
      - METAL_SUSTAINED_PRESSURE_CONTEXT
      - METAL_SHORT_WINDOW_CONTINUATION_THEN_WHIPSAW
      - METAL_EXTENDED_MFE_THEN_REVERSAL
      - METAL_NO_CHASE_AFTER_UPPER_SPIKE
  XAGUSD:
    default_role: METAL_VOLATILITY_LIFECYCLE
    golden_patterns:
      - METAL_SUSTAINED_PRESSURE_CONTEXT
      - METAL_SHORT_WINDOW_CONTINUATION_THEN_WHIPSAW
      - METAL_EXTENDED_MFE_THEN_REVERSAL
      - METAL_NO_CHASE_AFTER_UPPER_SPIKE

  # --- Tier A Pairs (new candidate reference pool — schema v2) ---

  CHFJPY:
    default_role: JPY_CHF_DUAL_BASKET_CROSS
    golden_patterns:
      - BASKET_THEME_CONFIRMATION_CONTEXT
      - JPY_BASKET_THEME_FOLLOWTHROUGH
      - FRAGMENTED_BASKET_ROTATION_NOT_ENTRY
      - MTF_BULLISH_PULLBACK_DECISION
      - LATE_SESSION_EXPANSION_FAIL
      - HIGH_DENSITY_ACCELERATION_CONTINUATION
      - TIMING_VALID_NOT_FINAL
      - JPY_ALIGNMENT_REQUIRED
  NZDJPY:
    default_role: JPY_BASKET_SECONDARY_CONFIRMATION
    golden_patterns:
      - BASKET_THEME_CONFIRMATION_CONTEXT
      - JPY_BASKET_SECONDARY_CONFIRMATION
      - FRAGMENTED_THEME_FOLLOWTHROUGH
      - DELAYED_JPY_CROSS_CONTINUATION
      - MACRO_BULLISH_INTRADAY_PULLBACK_DECISION
      - POST_EXPANSION_NO_CHASE_FILTER
      - TIMING_VALID_NOT_FINAL
      - JPY_ALIGNMENT_REQUIRED
  GBPUSD:
    default_role: MAJOR_CABLE_CONTEXT
    golden_patterns:
      - LOW_DENSITY_OPEN_LANE_TIMING_BLOCK
      - TIMING_VALID_NOT_FINAL
  EURNZD:
    default_role: NZD_WEAKNESS_EUR_CROSS
    golden_patterns:
      - CLEAN_SAME_PAIR_TAKEOVER
      - LOW_DENSITY_OPEN_LANE_TIMING_BLOCK
      - TIMING_VALID_NOT_FINAL
  AUDNZD:
    default_role: ANTIPODEAN_CROSS_RANGE
    golden_patterns:
      - LOW_DENSITY_OPEN_LANE_TIMING_BLOCK
      - CLEAN_SAME_PAIR_TAKEOVER
  GBPAUD:
    default_role: GBP_AUD_VOLATILITY_CROSS
    golden_patterns:
      - CLEAN_SAME_PAIR_TAKEOVER
      - TIMING_VALID_NOT_FINAL
  EURGBP:
    default_role: EUR_GBP_RANGE_CROSS
    golden_patterns:
      - LOW_DENSITY_OPEN_LANE_TIMING_BLOCK
      - TIMING_VALID_NOT_FINAL
  AUDUSD:
    default_role: MAJOR_AUD_CONTEXT
    golden_patterns:
      - LOW_DENSITY_OPEN_LANE_TIMING_BLOCK
      - TIMING_VALID_NOT_FINAL
  AUDCHF:
    default_role: AUD_CHF_DUAL_BASKET_CROSS
    golden_patterns:
      - BASKET_THEME_CONFIRMATION_CONTEXT
      - TIMING_VALID_NOT_FINAL
  EURAUD:
    default_role: MULTI_WAVE_PRIORITY_PAIR
    golden_patterns:
      - MULTI_WAVE_PRIORITY
      - CLEAN_SAME_PAIR_TAKEOVER
      - LOW_DENSITY_OPEN_LANE_TIMING_BLOCK
      - TIMING_VALID_NOT_FINAL

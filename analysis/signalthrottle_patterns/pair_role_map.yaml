pair_role_map:
  GBPCAD:
    default_role: PRIMARY_TIMING_CAD_WEAKNESS
    golden_patterns:
      - OPEN_LANE_TIMING_VALID
      - ZERO_DRAWDOWN_FOLLOWTHROUGH
      - PRE_IGNITION_COUNTERFLOW_TRAP
      - HIGH_DENSITY_ACCELERATION
      - LATE_DENSE_CONGESTION
      - LATE_MICROBOOST_DECISION_POINT
  EURCAD:
    default_role: DELAYED_IGNITION_CAD_WEAKNESS
    golden_patterns:
      - DELAYED_IGNITION_MICROBOOST
      - LATE_UPPER_MICROBOOST
  AUDCAD:
    default_role: LATE_SATURATION_CAD_WEAKNESS
    golden_patterns:
      - LATE_UPPER_MICROBOOST
      - SATURATION_MICROBOOST_WARNING
  NZDCAD:
    default_role: SECONDARY_CONFIRMATION_CAD_WEAKNESS
    golden_patterns:
      - SECONDARY_OPEN_LANE_CONFIRMATION
      - LATE_SECONDARY_SATURATION
      - CONFIRMATION_PAIR_NOT_PRIMARY_ENTRY
  CADCHF:
    default_role: CLEAN_INVERSE_CONFIRMATION_CAD_WEAKNESS
    golden_patterns:
      - INVERSE_MIRROR_BREAKDOWN
      - INVERSE_COOLING_PAUSE
      - CONFIRMATION_PAIR_NOT_PRIMARY_ENTRY
  CADJPY:
    default_role: JPY_SENSITIVE_INVERSE_CONFIRMATION
    golden_patterns:
      - EARLY_INVERSE_OPEN_LANE_CONFIRMATION
      - DELAYED_INVERSE_IGNITION
      - INVERSE_MIRROR_BREAKDOWN_CONFIRMATION
      - LOWER_RANGE_NO_CHASE_FILTER
      - INVERSE_LATE_SELL_TRAP
      - CLEAN_BLOCK_BUT_THEME_CONFLICT
      - JPY_ALIGNMENT_REQUIRED
  USDJPY:
    default_role: PHASE_SENSITIVE_JPY_MAJOR
    golden_patterns:
      - PHASE_SENSITIVE_BREAKDOWN
      - UPPER_ABSORPTION_WARNING
      - LIQUIDATION_EXPANSION
      - SPARSE_ARCHIVE
      - LOWER_RANGE_NO_CHASE_FILTER
      - JPY_ALIGNMENT_REQUIRED
  GBPJPY:
    default_role: PHASE_SENSITIVE_JPY_CROSS
    golden_patterns:
      - GBPJPY_BUY_MICROBURST_FOLLOWTHROUGH
      - GBPJPY_CLEAN_5M_WAIT_RECLAIM_NOT_FINAL
      - GBPJPY_HIGH_DENSITY_IN_BEARISH_CONTEXT_NO_CHASE
      - JPY_ALIGNMENT_REQUIRED
  AUDJPY:
    default_role: JPY_WEAKNESS_CONFIRMATION_CROSS
    golden_patterns:
      - AUDJPY_JPY_WEAKNESS_OPEN_LANE_CONTINUATION
      - AUDJPY_HIGH_DENSITY_PULLBACK_THEN_EXPAND
      - AUDJPY_LATE_UPPER_DENSITY_NO_CHASE
      - JPY_ALIGNMENT_REQUIRED
  NZDCHF:
    default_role: CHF_CROSS_PHASE_SENSITIVE
    golden_patterns:
      - NZDCHF_HOT_BLOCK_BEARISH_CONTINUATION
      - NZDCHF_REPEATED_MICROBURST_COUNTER_RECLAIM
      - NZDCHF_REPEATED_PRESSURE_AMBIGUOUS_MANAGEMENT
  EURCHF:
    default_role: CHF_WEAKNESS_MICROBOOST_CROSS
    golden_patterns:
      - EURCHF_MATURE_MICROBOOST_RECLAIM_REQUIRED
      - EURCHF_CHF_WEAKNESS_DELAYED_FOLLOWTHROUGH
      - EURCHF_UPPER_MICROBOOST_EXHAUSTION_FILTER
  EURUSD:
    default_role: MAJOR_CONTEXT_PAIR
    golden_patterns:
      - MAJOR_PAIR_DELAYED_CONTINUATION
      - PULLBACK_WITHIN_H4_EXPANSION
  GBPNZD:
    default_role: TAKEOVER_CONTEXTUAL_CROSS
    golden_patterns:
      - SAME_PAIR_TAKEOVER
      - SAME_PAIR_TAKEOVER_GRIND
      - TAKEOVER_TO_LATE_REVERSAL
      - CHOPPY_TAKEOVER_CONTINUATION
      - DAILY_CONFLICT_AFTER_INTRADAY_TAKEOVER
  USDCAD:
    default_role: MACRO_ANCHOR_AND_SIGNALWATCH_LIFECYCLE
    golden_patterns:
      - SLOW_ACTIVE_SIGNAL_SEED
      - SIGNALWATCH_LIFECYCLE_FINALIZER
      - ABSORPTION_WATCH_FAILED
      - HIGH_DENSITY_ABSORPTION_WITH_RECLAIM
  XAUUSD:
    default_role: METAL_VOLATILITY_LIFECYCLE
    golden_patterns:
      - METAL_SUSTAINED_PRESSURE_CONTEXT
      - METAL_SHORT_WINDOW_CONTINUATION_THEN_WHIPSAW
      - METAL_EXTENDED_MFE_THEN_REVERSAL
      - METAL_NO_CHASE_AFTER_UPPER_SPIKE
  XAGUSD:
    default_role: METAL_VOLATILITY_LIFECYCLE
    golden_patterns:
      - METAL_SUSTAINED_PRESSURE_CONTEXT
      - METAL_SHORT_WINDOW_CONTINUATION_THEN_WHIPSAW
      - METAL_EXTENDED_MFE_THEN_REVERSAL
      - METAL_NO_CHASE_AFTER_UPPER_SPIKE
  EURAUD:
    default_role: MULTI_WAVE_PRIORITY_PAIR
    golden_patterns:
      - MULTI_WAVE_PRIORITY

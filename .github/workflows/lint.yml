# Python type checks. Ruff is enforced separately by ci.yml.
# Keep the workflow name and final lint check stable during migration.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYRIGHT_VERSION: "1.1.414"

jobs:
  typecheck:
    name: Pyright (${{ matrix.scope }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: core
            os: ubuntu-24.04
          - scope: native-mcp
            os: windows-2022
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Record source and prepare analysis scope
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          TYPECHECK_SCOPE: ${{ matrix.scope }}
        run: python scripts/ci/typecheck_evidence.py prepare --scope "$TYPECHECK_SCOPE"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install isolated analysis environment
        run: |
          python -m venv .venv
          python - <<'PY'
          import os
          from pathlib import Path
          executable = Path(".venv") / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"VENV_PYTHON={executable.absolute().as_posix()}\n")
          PY

      - name: Install type-check dependencies
        run: |
          "$VENV_PYTHON" -m pip install -r artifacts/typecheck/requirements-input.txt
          "$VENV_PYTHON" -m pip check
          npm install --global --ignore-scripts --no-audit --no-fund "pyright@${PYRIGHT_VERSION}"

      - name: Record installed tools
        id: environment
        run: |
          "$VENV_PYTHON" --version > artifacts/typecheck/python-version.txt
          "$VENV_PYTHON" -m pip --version > artifacts/typecheck/pip-version.txt
          "$VENV_PYTHON" -m pip freeze > artifacts/typecheck/python-dependencies.txt
          node --version > artifacts/typecheck/node-version.txt
          npm --version > artifacts/typecheck/npm-version.txt
          pyright --version > artifacts/typecheck/pyright-version.txt
          "$VENV_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          expected = f"pyright {os.environ['PYRIGHT_VERSION']}"
          actual = Path("artifacts/typecheck/pyright-version.txt").read_text().strip()
          if actual != expected:
              raise SystemExit(f"Unexpected analyzer: {actual!r}; expected {expected!r}")
          PY

      - name: Run Pyright without suppressing failures
        id: typecheck
        run: |
          set +e
          pyright --project .pyright-ci.json --pythonpath "$VENV_PYTHON" --outputjson \
            > artifacts/typecheck/pyright.json 2> artifacts/typecheck/pyright-stderr.txt
          status=$?
          set -e
          printf '%s\n' "$status" > artifacts/typecheck/pyright-exit-code.txt
          exit "$status"

      - name: Validate and summarize report
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        env:
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
        run: '"$VENV_PYTHON" scripts/ci/typecheck_evidence.py summarize'

      - name: Upload typecheck evidence
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: typecheck-${{ matrix.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/typecheck/
          if-no-files-found: error
          retention-days: 14

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [typecheck]
    if: ${{ always() }}
    steps:
      - name: Require all typecheck scopes to pass
        shell: bash
        env:
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
        run: |
          printf 'Typecheck result: %s\n' "$TYPECHECK_RESULT"
          if [[ "$TYPECHECK_RESULT" != "success" ]]; then
            echo "::error::All typecheck scopes must complete successfully."
            exit 1
          fi
          echo "All typecheck scopes passed."

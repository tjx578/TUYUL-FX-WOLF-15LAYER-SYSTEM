name: Railway Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-railway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ matrix.service }} (gated)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    strategy:
      # Deploy every service independently so one failing service does not block the rest.
      fail-fast: false
      matrix:
        # IMPORTANT: each entry MUST match the exact service name in the Railway project,
        # AND that service must point its Config-as-code path to its own railway-<svc>.toml
        # (Railway dashboard -> service -> Settings -> Config-as-code). Otherwise the deploy
        # for that service fails ("service not found") or uses the wrong config.
        # Source of these names: infrastructure/railway/railway.json. Verify in the dashboard.
        # (migrator intentionally excluded -- run DB migrations deliberately, not per push.)
        service:
          - wolf15-api
          - wolf15-engine
          - wolf15-ingest
          - wolf15-orchestrator
          - wolf15-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate token presence
        id: check_token
        env:
          RAILWAY_TOKEN: ${{ secrets['RAILWAY_TOKEN'] }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is not configured"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy ${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets['RAILWAY_TOKEN'] }}
        # --service targets one service; --ci runs non-interactively. Each service uses its
        # own Config-as-code file as configured in the Railway dashboard.
        run: railway up --service "${{ matrix.service }}" --ci

name: Railway Deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact reviewed 40-character current main commit"
        required: true
        type: string
      ci_run_id:
        description: "Successful CI run for this exact main commit"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-railway-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.service }} (gated)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      RAILWAY_PROJECT_ID: af4d15d8-d4cb-44b7-80e7-d99a37ca0045
      RAILWAY_ENVIRONMENT_ID: 5838964d-8c76-42b3-b0b9-18f2d1e4d5c2
    strategy:
      # Deploy every service independently so one failing service does not block the rest.
      fail-fast: false
      matrix:
        # IMPORTANT: each entry MUST match the exact service name in the Railway project,
        # AND that service must point its Config-as-code path to its own railway-<svc>.toml
        # (Railway dashboard -> service -> Settings -> Config-as-code). Otherwise the deploy
        # for that service fails ("service not found") or uses the wrong config.
        # Verified existing services; removed nonexistent wolf15-worker without
        # adding or activating any replacement worker service.
        # (migrator intentionally excluded -- run DB migrations deliberately, not per push.)
        include:
          - service: wolf15-api
            service_id: d3f53524-4571-496f-8008-b3f98fedc5b9
          - service: wolf15-engine
            service_id: 43bc213a-96af-4ed5-b679-691534fad4b4
          - service: wolf15-ingest
            service_id: e7fb1aa7-2ca0-4287-bd53-35d82181c890
          - service: wolf15-orchestrator
            service_id: 4492195c-81cd-4e7d-88e8-bf6e380bbcc2
    steps:
      # Bootstrap from the main workflow itself, before any repository code runs.
      # A release input must never select the validator that authorizes it.
      - name: Bind release to trusted main workflow before checkout
        shell: bash
        env:
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          TRUSTED_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ||
                "$GITHUB_REF" != "refs/heads/main" ||
                "$TRUSTED_WORKFLOW_REF" != "$GITHUB_REPOSITORY/.github/workflows/railway-deploy.yml@refs/heads/main" ||
                ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ||
                "$RELEASE_SHA" != "$GITHUB_SHA" ||
                "$RELEASE_SHA" != "$TRUSTED_WORKFLOW_SHA" ]]; then
            echo "::error::Release must match the trusted main workflow commit"
            exit 1
          fi

      - name: Checkout trusted main workflow source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify exact-source CI receipt before provider credentials
        env:
          GH_TOKEN: ${{ github.token }}
        # Only this trusted checkout may supply imports; ignore ambient Python paths/site hooks.
        run: >-
          python -I -S -c 'import sys; sys.path.insert(0, "scripts/ci");
          import railway_release_source_gate as gate; raise SystemExit(gate.main())'

      - name: Validate token presence
        id: check_token
        env:
          RAILWAY_TOKEN: ${{ secrets['RAILWAY_TOKEN'] }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is not configured"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pinned Railway CLI
        run: npm install -g @railway/cli@5.41.0

      - name: Verify Railway CLI version
        run: test "$(railway --version)" = "railway 5.41.0"

      - name: Recheck source and CI immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -I -S -c 'import sys; sys.path.insert(0, "scripts/ci");
          import railway_release_source_gate as gate; raise SystemExit(gate.main())'

      - name: Deploy ${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets['RAILWAY_TOKEN'] }}
        # --service targets one service; --ci runs non-interactively. Each service uses its
        # own Config-as-code file as configured in the Railway dashboard.
        run: |
          set -euo pipefail
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "${{ matrix.service_id }}" \
            --ci \
            --message "release_sha=${RELEASE_SHA}"

name: Windows Credential Broker Package

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/windows/wolf15_credential_broker/**"
      - "ea_interface/wolf15_executor/credential-pipe-contract.v1.json"
      - "tests/test_mt5_dpapi_pipe_credential_loader.py"
      - ".github/workflows/windows-credential-broker-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build and package Windows broker
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install source-contract test dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run credential pipe source-contract tests
        shell: pwsh
        run: python -m pytest tests/test_mt5_dpapi_pipe_credential_loader.py -q

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore broker project
        shell: pwsh
        run: >-
          dotnet restore
          tools/windows/wolf15_credential_broker/Wolf15CredentialBroker.csproj

      - name: Build broker
        shell: pwsh
        run: >-
          dotnet build
          tools/windows/wolf15_credential_broker/Wolf15CredentialBroker.csproj
          --configuration Release
          --no-restore

      - name: Smoke test controlled failure contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Resolve-Path "tools/windows/wolf15_credential_broker/bin/Release/net48/Wolf15CredentialBroker.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "wolf15-broker-smoke.stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "wolf15-broker-smoke.stderr.txt"

          $process = Start-Process `
            -FilePath $exe `
            -NoNewWindow `
            -Wait `
            -PassThru `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr

          if ($process.ExitCode -ne 2) {
            throw "Expected controlled failure exit code 2, got $($process.ExitCode)"
          }

          $errorText = (Get-Content -LiteralPath $stderr -Raw).Trim()
          if ($errorText -ne "ARGUMENT_CONTRACT_INVALID") {
            throw "Unexpected controlled failure output: $errorText"
          }

          Write-Host "BROKER_SMOKE_TEST=PASS"

      - name: Assemble provenance package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $PWD "artifacts/wolf15-credential-broker-windows"
          New-Item -ItemType Directory -Force -Path $package | Out-Null

          $buildRoot = Join-Path $PWD "tools/windows/wolf15_credential_broker/bin/Release/net48"
          $exe = Join-Path $buildRoot "Wolf15CredentialBroker.exe"
          $pdb = Join-Path $buildRoot "Wolf15CredentialBroker.pdb"

          if (-not (Test-Path -LiteralPath $exe)) {
            throw "BROKER_EXE_NOT_FOUND"
          }

          Copy-Item -LiteralPath $exe -Destination $package
          if (Test-Path -LiteralPath $pdb) {
            Copy-Item -LiteralPath $pdb -Destination $package
          }

          $sha = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  Wolf15CredentialBroker.exe" |
            Set-Content -LiteralPath (Join-Path $package "SHA256SUMS.txt") -Encoding ASCII

          $provenance = [ordered]@{
            schema = "wolf15.windows_credential_broker_artifact.v1"
            repository = "${{ github.repository }}"
            commit_sha = "${{ github.sha }}"
            workflow = "${{ github.workflow }}"
            workflow_run_id = "${{ github.run_id }}"
            workflow_run_attempt = "${{ github.run_attempt }}"
            target_framework = "net48"
            source_path = "tools/windows/wolf15_credential_broker/Wolf15CredentialBroker.cs"
            project_path = "tools/windows/wolf15_credential_broker/Wolf15CredentialBroker.csproj"
            executable = "Wolf15CredentialBroker.exe"
            executable_sha256 = $sha
            generated_at_utc = (Get-Date).ToUniversalTime().ToString("o")
          }

          $provenance |
            ConvertTo-Json -Depth 4 |
            Set-Content -LiteralPath (Join-Path $package "provenance.json") -Encoding UTF8

          Write-Host "BROKER_EXE_SHA256=$sha"
          Write-Host "PACKAGE_PATH=$package"

      - name: Upload verified broker artifact
        uses: actions/upload-artifact@v4
        with:
          name: wolf15-credential-broker-windows
          path: artifacts/wolf15-credential-broker-windows/
          if-no-files-found: error
          retention-days: 30

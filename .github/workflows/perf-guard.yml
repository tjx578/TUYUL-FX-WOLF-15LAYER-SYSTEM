# Performance checks complement the six required benchmarks in ci.yml.
name: Perf Guard

on:
  push:
    paths: &perf_paths
      - "**/*.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - "config/**"
      - ".github/workflows/perf-guard.yml"
  pull_request:
    paths: *perf_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.11"
  PYTHONPATH: .
  WOLF15_LOAD_DOTENV: "false"
  APP_ENV: test
  ENV: test

jobs:
  checks:
    name: Perf / ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [imports, tests, size]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        if: matrix.check != 'size'
        run: python -m pip install -r requirements.txt
      - name: Run bounded check
        run: python -m scripts.ci.perf_guard ${{ matrix.check }}
      - name: Upload check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-${{ matrix.check }}
          path: artifacts/perf-guard/${{ matrix.check }}/
          if-no-files-found: error
          retention-days: 14

  perf-gate:
    name: Perf Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: checks
    if: always()
    steps:
      - name: Evaluate every matrix check
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
        run: |
          if [[ "$CHECK_RESULT" != "success" ]]; then
            echo "::error::Performance checks did not all succeed ($CHECK_RESULT)"
            exit 1
          fi
          echo "All performance checks completed successfully"

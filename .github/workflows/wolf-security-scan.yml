name: Wolf Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  security-events: write

jobs:
  # ---------------------------------------------------------------
  # Python: pip-audit
  # ---------------------------------------------------------------
  pip-audit:
    name: "pip-audit (Python deps)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run pip-audit (hard-fail)
        run: pip-audit --desc --strict

  # ---------------------------------------------------------------
  # Node.js: npm audit
  # ---------------------------------------------------------------
  npm-audit:
    name: "npm audit (Node deps)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/nextjs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/nextjs/package-lock.json

      - name: Validate lockfile sync
        run: npm ci --ignore-scripts

      - name: Install dependencies
        run: |
          npm set fetch-retries 5
          npm ci

      - name: Run npm audit (report)
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit-report.json
          audit_status=$?
          set -e
          echo "$audit_status" > npm-audit-exit.txt

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: dashboard/nextjs/npm-audit-report.json
          if-no-files-found: warn

      - name: Fail on high+
        run: |
          node --test ../../scripts/ci/npm_audit_gate.test.mjs
          node ../../scripts/ci/npm_audit_gate.mjs npm-audit-report.json "$(cat npm-audit-exit.txt)"

  # ---------------------------------------------------------------
  # Secret leak scan
  # ---------------------------------------------------------------
  secret-scan:
    name: "Secret leak scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install trufflehog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/v3.97.4/scripts/install.sh | sh -s -- -b /usr/local/bin v3.97.4

      - name: Scan for secrets (hard-fail)
        run: python scripts/ci/secret_scan_receipt.py

      - name: Upload redacted secret detection receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-detection-receipt
          path: artifacts/secret-scan/receipt.json
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Security gate
  # ---------------------------------------------------------------
  security-gate:
    name: "Security Gate"
    runs-on: ubuntu-latest
    needs: [pip-audit, npm-audit, secret-scan]
    if: always()
    steps:
      - name: Evaluate security results
        run: |
          set -euo pipefail

          declare -A results=(
            ["pip-audit"]="${{ needs.pip-audit.result }}"
            ["npm-audit"]="${{ needs.npm-audit.result }}"
            ["secret-scan"]="${{ needs.secret-scan.result }}"
          )

          failed=0
          for job in "${!results[@]}"; do
            if [[ "${results[$job]}" != "success" ]]; then
              echo "::error::$job failed (result=${results[$job]})"
              failed=1
            fi
          done

          if [[ "$failed" -eq 1 ]]; then
            exit 1
          fi

          echo "✅ All security gates passed"

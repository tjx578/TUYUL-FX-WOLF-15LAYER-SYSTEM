name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on feature branches to save minutes, but NEVER cancel on
  # main -- a cancelled CI ends with conclusion 'cancelled', which fails the deploy
  # gate (Railway Deploy requires CI conclusion == 'success' on main). Rapid auto-commit
  # pushes were cancelling main CI before it finished, so deploys never fired.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  ruff:
    name: Ruff lint & format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        # Pinned: an unpinned lint gate re-baselines itself on every ruff
        # release, so a green PR can turn red with no code change. The cleanup
        # in this branch is only meaningful against a fixed version. Bump
        # deliberately, in its own change.
        run: pip install ruff==0.15.7

      - name: Ruff check (lint — hard fail)
        run: ruff check . --config pyproject.toml

      - name: Ruff format check (hard fail)
        if: ${{ !cancelled() }}
        run: ruff format --check --diff . --config pyproject.toml

  tests:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wolf_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: wolf15_ci_test
        options: >-
          --health-cmd "pg_isready -U wolf_user -d wolf15_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      PYTHONPATH: .
      REDIS_URL: redis://localhost:6379/0
      WOLF15_RUN_MODE_OWNER_REDIS: "1"
      WOLF15_MODE_OWNER_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      WOLF15_C06_TEST_REDIS_URL: redis://127.0.0.1:6379/14
      WOLF15_C06_DISPOSABLE_REDIS: YES_I_UNDERSTAND
      WOLF15_C06_OUTPUT: artifacts/c06-effective-api
      DATABASE_URL: postgresql://wolf_user:test_password@localhost:5432/wolf15_ci_test
      WOLF15_PAIR_ACTIVITY_TEST_DATABASE_URL: postgresql://wolf_user:test_password@localhost:5432/wolf15_ci_test
      WOLF15_RUN_POSTGRES_INTEGRATION: "1"
      WOLF15_PAIR_ACTIVITY_EXPECTED_PG_MAJOR: "16"
      WOLF15_POSTGRES_TEST_DATABASE: wolf15_ci_test
      WOLF15_ALLOW_DESTRUCTIVE_PG_TESTS: YES_I_UNDERSTAND
      DASHBOARD_JWT_SECRET: ci-test-secret-do-not-use-in-prod
      JWT_SECRET: ci-test-secret-do-not-use-in-prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout pytest-asyncio pytest-cov

      - name: Bind exact disposable PostgreSQL service address
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          python - <<'PYEOF'
          import json
          import os
          import subprocess
          from ipaddress import ip_address

          service_id = os.environ["POSTGRES_SERVICE_ID"]
          assert service_id, "PostgreSQL service identity is required"
          inspected = json.loads(subprocess.check_output(["docker", "inspect", service_id], text=True))
          assert len(inspected) == 1 and inspected[0]["Id"] == service_id
          assert inspected[0]["State"]["Running"] is True
          networks = inspected[0]["NetworkSettings"]["Networks"]
          assert len(networks) == 1, "Ambiguous PostgreSQL service network"
          address = str(ip_address(next(iter(networks.values()))["IPAddress"]))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"WOLF15_POSTGRES_TEST_SERVER_ADDRESS={address}\n")
          print(json.dumps({"service_id": service_id, "server_address": address}))
          PYEOF

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Mark PostgreSQL as a disposable test environment
        run: |
          python - <<'PYEOF'
          import asyncio
          import os

          import asyncpg


          async def main() -> None:
              connection = await asyncpg.connect(os.environ["DATABASE_URL"])
              try:
                  await connection.execute(
                      "ALTER DATABASE wolf15_ci_test "
                      "SET wolf15.environment_class = 'DISPOSABLE_TEST'"
                  )
                  await connection.execute(
                      "ALTER DATABASE wolf15_ci_test "
                      "SET wolf15.destructive_tests_allowed = 'true'"
                  )
              finally:
                  await connection.close()

              verification = await asyncpg.connect(os.environ["DATABASE_URL"])
              try:
                  assert await verification.fetchval(
                      "SELECT current_setting('wolf15.environment_class', true)"
                  ) == "DISPOSABLE_TEST"
                  assert await verification.fetchval(
                      "SELECT current_setting('wolf15.destructive_tests_allowed', true)"
                  ) == "true"
              finally:
                  await verification.close()


          asyncio.run(main())
          PYEOF

      - name: Qualify disposable Linux PostgreSQL and Redis runner
        run: python scripts/ci/qualify_disposable_runner.py

      - name: Require supported PostgreSQL upgrade with existing data
        run: python scripts/ci/run_supported_upgrade_acceptance.py

      - name: Require authenticated D0 reconciliation on disposable PostgreSQL
        run: |
          python -m pytest tests/test_broker_reconciliation_evidence.py \
            tests/test_mt5_engineering_demo_canary.py \
            tests/integration/test_mt5_engineering_demo_canary_postgres.py \
            -o addopts= -q --timeout=60 \
            --junitxml=artifacts/python-suite/d0-reconciliation.xml
          python scripts/ci/validate_suite_junit.py artifacts/python-suite/d0-reconciliation.xml

      - name: Require distributed mode-owner Redis acceptance
        run: |
          python -m pytest tests/integration/test_orchestrator_mode_owner_redis.py \
            -o addopts= -q --timeout=60 \
            --junitxml=artifacts/python-suite/mode-owner.xml
          python scripts/ci/validate_suite_junit.py artifacts/python-suite/mode-owner.xml

      - name: Require actual in-flight PostgreSQL shutdown drain
        run: |
          python -m pytest tests/integration/test_runtime_drain_postgres.py \
            --noconftest -o addopts= -q --timeout=60 \
            --junitxml=artifacts/python-suite/runtime-drain.xml
          python scripts/ci/validate_suite_junit.py artifacts/python-suite/runtime-drain.xml

      - name: Require effective Railway API role acceptance
        run: python scripts/ci/effective_api_role_acceptance.py

      - name: Upload effective Railway API role evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c06-effective-api
          path: artifacts/c06-effective-api/
          if-no-files-found: error
          retention-days: 14

      - name: Require executed S03 PostgreSQL acceptance
        run: python scripts/ci/run_pair_activity_runtime_acceptance.py

      - name: Require separate S03 producer and relay PostgreSQL acceptance
        run: python scripts/ci/run_activity_delivery_producer_acceptance.py

      - name: Require separate S03 consumer and owner PostgreSQL acceptance
        run: python scripts/ci/run_activity_delivery_consumer_acceptance.py

      - name: Require disposable consumer application-role PostgreSQL acceptance
        run: python scripts/ci/run_activity_consumer_role_acceptance.py

      - name: Require separate candidate capacity and TEST_ONLY transaction PostgreSQL acceptance
        run: python scripts/ci/run_strategy_persistence_acceptance.py

      - name: Upload S03 source-bound PostgreSQL receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pair-activity-runtime-acceptance
          path: artifacts/pair-activity-runtime/
          if-no-files-found: error
          retention-days: 14

      - name: Run pytest with coverage
        run: |
          pytest tests/ \
            --ignore=tests/test_native_mt5_readonly_mcp.py \
            -v --tb=short -m "not benchmark" \
            --timeout=60 \
            --cov=analysis --cov=constitution --cov=execution \
            --cov=dashboard --cov=journal --cov=risk \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=artifacts/python-suite/tests.xml
          python scripts/ci/validate_suite_junit.py artifacts/python-suite/tests.xml

      - name: Require uninstrumented latency budgets
        if: ${{ !cancelled() }}
        run: |
          python -m pytest tests/test_ws_connection_stress.py tests/test_load_tick_stress.py -m benchmark \
            -o addopts= -q --timeout=60 \
            --junitxml=artifacts/python-suite/benchmark.xml
          python - <<'PYEOF'
          from xml.etree import ElementTree as ET
          root = ET.parse('artifacts/python-suite/benchmark.xml')
          cases = root.findall('.//testcase')
          assert {case.get('name') for case in cases} == {
              'test_broadcast_50_clients_under_100ms',
              'test_broadcast_1000_messages_to_10_clients',
              'test_process_10k_ticks_within_time_bound',
              'test_throughput_meets_minimum',
              'test_multi_symbol_throughput',
              'test_processing_latency_per_cycle',
          }
          assert len(cases) == 6
          assert all(not list(case.iter('skipped')) and not list(case.iter('failure'))
                     and not list(case.iter('error')) for case in cases)
          PYEOF

      - name: Upload complete Python test outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-suite-junit
          path: artifacts/python-suite/*.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            artifacts/python-suite/tests.xml
          retention-days: 14

  dashboard:
    name: Dashboard build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/nextjs
    env:
      # Build fixtures only: no production endpoints or machine credentials.
      DASHBOARD_MODE: viewer
      DASHBOARD_CANONICAL_ORIGIN: https://dashboard.example.invalid
      INTERNAL_API_URL: https://api.example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: dashboard/nextjs/package-lock.json

      - name: Set up disposable owner-login Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install owner-login contract dependencies
        run: |
          python -m pip install -r ../../requirements.txt
          python -c 'import os, sys; print("OWNER_LOGIN_TEST_PYTHON=" + sys.executable)' >> "$GITHUB_ENV"

      - name: Install
        run: |
          npm set fetch-retries 5
          npm ci

      - name: Lint
        run: npm run lint

      - name: Dashboard tests
        run: npm test

      - name: Build
        run: npm run build:strict

  runtime-acceptance:
    name: P1 built runtime acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build candidate runtime image
        id: runtime-image
        run: docker build --label org.opencontainers.image.revision=$GITHUB_SHA -t wolf15-p1-runtime:$GITHUB_SHA .
      - name: Require built runtime ownership readiness and shutdown acceptance
        run: python scripts/ci/p1_runtime_acceptance.py --image wolf15-p1-runtime:$GITHUB_SHA --output artifacts/p1-runtime.json
      - name: Require actual orchestrator role process acceptance
        if: ${{ !cancelled() && steps.runtime-image.outcome == 'success' }}
        run: python scripts/ci/orchestrator_process_acceptance.py --image wolf15-p1-runtime:$GITHUB_SHA --output artifacts/orchestrator-process.json
      - name: Require actual ingest role process acceptance
        if: ${{ !cancelled() && steps.runtime-image.outcome == 'success' }}
        run: python scripts/ci/ingest_process_acceptance.py --image wolf15-p1-runtime:$GITHUB_SHA --output artifacts/ingest-process.json
      - name: Require actual engine and trade role process acceptance
        if: ${{ !cancelled() && steps.runtime-image.outcome == 'success' }}
        run: python scripts/ci/engine_trade_process_acceptance.py --image wolf15-p1-runtime:$GITHUB_SHA --output artifacts/engine-trade-process.json
      - name: Require built engine failure recovery and quiescent shutdown
        if: ${{ !cancelled() && steps.runtime-image.outcome == 'success' }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from scripts.ci.built_engine_acceptance import SOURCES
          Path('artifacts/engine-sources.json').write_text(json.dumps({p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in SOURCES}))
          Path('artifacts/engine-build-inputs.json').write_text(json.dumps({p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in ('Dockerfile', '.dockerignore', 'requirements.txt')}))
          PY
          docker image inspect --format '{{.Id}}' wolf15-p1-runtime:$GITHUB_SHA > artifacts/engine-image-id.txt
          docker run --rm --network none --entrypoint python \
            -e WOLF15_TEST_ENGINE_SOURCES_JSON="$(cat artifacts/engine-sources.json)" \
            wolf15-p1-runtime:$GITHUB_SHA \
            -m scripts.ci.built_engine_acceptance > artifacts/built-engine.json
      - name: Require actual pressure outbox role process acceptance
        if: ${{ !cancelled() && steps.runtime-image.outcome == 'success' }}
        run: python scripts/ci/pressure_outbox_process_acceptance.py --image wolf15-p1-runtime:$GITHUB_SHA --output artifacts/pressure-outbox-process.json
      - name: Upload built runtime receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-runtime-acceptance
          path: |
            artifacts/p1-runtime.json
            artifacts/orchestrator-process.json
            artifacts/ingest-process.json
            artifacts/engine-trade-process.json
            artifacts/built-engine.json
            artifacts/engine-sources.json
            artifacts/engine-build-inputs.json
            artifacts/engine-image-id.txt
            artifacts/pressure-outbox-process.json
          if-no-files-found: error

  # MCP2 and the API intentionally use separate dependency environments.
  # This file is moved out of the API suite above, not skipped as acceptance.
  native-mcp-tests:
    name: Native MCP fixture tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install isolated MCP test dependencies
        # Never install/import the native MetaTrader5 terminal package in this job.
        # Its tests supply FakeMT5; mcp2 needs newer Pydantic than API requirements.
        run: pip install mcp==2.0.0 psutil==7.2.2 pytest==9.0.3 pytest-asyncio==1.3.0 pytest-timeout

      - name: Run native MCP fixture suite
        run: python -m pytest tests/test_native_mt5_readonly_mcp.py -v --tb=short --timeout=60

  # -------------------------------------------------------------------
  # Deprecated shim guard — block resurrection of retired modules
  # -------------------------------------------------------------------
  shim-guard:
    name: Deprecated shim guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Block resurrected shim files"
        run: |
          echo "Checking that retired shim files have not been re-created..."
          RETIRED_SHIMS=(
            "dashboard/price_feed.py"
            "dashboard/trade_ledger.py"
          )
          FOUND=0
          for SHIM in "${RETIRED_SHIMS[@]}"; do
            if [ -f "$SHIM" ]; then
              echo "::error::Retired shim resurrected: $SHIM"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "Remove the file(s) above. Canonical modules live in storage/."
            exit 1
          fi
          echo "No retired shims found."

      - name: "Block deprecated imports in production code"
        shell: python
        run: |
          import ast
          import pathlib
          import subprocess
          import sys

          retired = {"dashboard.price_feed", "dashboard.trade_ledger"}
          failed = False
          paths = subprocess.check_output(["git", "ls-files", "-z", "*.py"]).decode().split("\0")
          for name in filter(None, paths):
              path = pathlib.Path(name)
              if any(part in {"tests", "__pycache__", ".venv", "node_modules"} for part in path.parts):
                  continue
              try:
                  tree = ast.parse(path.read_bytes(), filename=name)
              except SyntaxError:
                  print(f"::error file={name}::Python syntax error prevents import inspection")
                  failed = True
                  continue
              for node in ast.walk(tree):
                  imports = []
                  if isinstance(node, ast.Import):
                      imports = [alias.name for alias in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      module = node.module or ""
                      imports = [module, *(f"{module}.{alias.name}" for alias in node.names)]
                  if any(module == old or module.startswith(old + ".") for module in imports for old in retired):
                      print(f"::error file={name},line={node.lineno}::Deprecated dashboard import; use storage instead")
                      failed = True
          sys.exit(1 if failed else 0)

  # -------------------------------------------------------------------
  # Architecture drift guard — constitutional boundary spot-checks
  # -------------------------------------------------------------------
  drift-guard:
    name: Architecture drift guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "analysis/ must not contain execution logic"
        run: |
          VIOLATIONS=$(grep -rn --include="*.py" \
            -e "place_order" -e "execute_trade" -e "send_order" \
            -e "market_execution" -e "mt4_send" -e "mt5_send" \
            analysis/ || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::analysis/ contains execution logic"
            echo "$VIOLATIONS"
            exit 1
          fi

      - name: "execution/ must not contain strategy logic"
        run: |
          VIOLATIONS=$(grep -rn --include="*.py" \
            -e "calculate_signal" -e "market_direction" -e "trend_analysis" \
            -e "wolf_score" -e "generate_verdict" \
            execution/ || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::execution/ contains strategy logic"
            echo "$VIOLATIONS"
            exit 1
          fi

      - name: "L12 signal must not carry account state"
        run: |
          python - <<'PYEOF'
          import ast, pathlib, re, sys

          ACCOUNT_FIELDS = re.compile(
              r'\b(balance|equity|margin_used|margin_free|account_size)\b'
          )
          TARGET = pathlib.Path('contracts/redis_stream_contracts.py')
          if not TARGET.exists():
              print(f'::error::Required contract {TARGET} not found')
              sys.exit(1)

          text = TARGET.read_text(encoding='utf-8')
          tree = ast.parse(text, filename=str(TARGET))
          verdicts = [node for node in tree.body
                      if isinstance(node, ast.ClassDef) and node.name == 'VerdictPayload']
          if len(verdicts) != 1:
              print('::error::Exactly one top-level VerdictPayload declaration is required')
              sys.exit(1)
          errors = []
          for node in ast.walk(verdicts[0]):
              name = node.id if isinstance(node, ast.Name) else node.attr if isinstance(node, ast.Attribute) else None
              if name and ACCOUNT_FIELDS.fullmatch(name):
                  errors.append(f'  {TARGET}:{node.lineno}: forbidden account field {name}')
          if errors:
              print('::error::VerdictPayload contains account-state fields:')
              for e in errors:
                  print(e)
              sys.exit(1)
          print('VerdictPayload is clean — no account-state fields.')
          PYEOF

  # -------------------------------------------------------------------
  # CI Gate — required status check for branch protection
  # -------------------------------------------------------------------
  built-api:
    name: Built API bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build exact-source API image
        run: |
          mkdir -p artifacts/built-api
          test -z "$(git status --porcelain)"
          docker build --iidfile artifacts/built-api/image-id.txt .

      - name: Exercise built API bootstrap and served readiness
        run: |
          docker run --rm --network none \
            -e WOLF15_TEST_APP_SHA256="$(sha256sum api/app_factory.py | cut -d ' ' -f 1)" \
            -e WOLF15_TEST_REGISTRY_SHA256="$(sha256sum api/router_registry.py | cut -d ' ' -f 1)" \
            -e WOLF15_TEST_ENTRYPOINT_SHA256="$(sha256sum api_server.py | cut -d ' ' -f 1)" \
            -e WOLF15_TEST_SUPERVISOR_SHA256="$(sha256sum startup/required_tasks.py | cut -d ' ' -f 1)" \
            "$(cat artifacts/built-api/image-id.txt)" \
            python scripts/ci/built_api_acceptance.py > artifacts/built-api/receipt.json

      - name: Upload built API evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: built-api-bootstrap
          path: artifacts/built-api/
          if-no-files-found: error
          retention-days: 14

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [ruff, tests, dashboard, native-mcp-tests, shim-guard, drift-guard, runtime-acceptance, built-api]
    if: always()
    steps:
      - name: Evaluate all upstream jobs
        run: |
          echo "ruff:        ${{ needs.ruff.result }}"
          echo "tests:       ${{ needs.tests.result }}"
          echo "dashboard:   ${{ needs.dashboard.result }}"
          echo "native-mcp:  ${{ needs.native-mcp-tests.result }}"
          echo "shim-guard:  ${{ needs.shim-guard.result }}"
          echo "drift-guard: ${{ needs.drift-guard.result }}"
          echo "runtime:     ${{ needs.runtime-acceptance.result }}"
          echo "built-api:   ${{ needs.built-api.result }}"

          FAILED=0
          for JOB in \
            "${{ needs.ruff.result }}" \
            "${{ needs.tests.result }}" \
            "${{ needs.dashboard.result }}" \
            "${{ needs.native-mcp-tests.result }}" \
            "${{ needs.shim-guard.result }}" \
            "${{ needs.drift-guard.result }}" \
            "${{ needs.runtime-acceptance.result }}" \
            "${{ needs.built-api.result }}"; do
            if [[ "$JOB" != "success" ]]; then
              FAILED=1
            fi
          done

          if [[ "$FAILED" -eq 1 ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi

          echo "All CI gates passed"

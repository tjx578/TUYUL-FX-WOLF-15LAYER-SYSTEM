# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Manual verification entry point. Reuse the maintained checks at this commit.
# Required PR checks remain CI Gate, Security Gate and Docs Gate from their
# canonical workflows. This wrapper is not a Railway release receipt.
name: "Wolf 15-Layer CI"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Called workflows share github.workflow with the caller. Keep this prefix
  # different from ci.yml and its nested lint.yml to avoid self-cancellation.
  group: manual-wolf-pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Canonical CI
    uses: ./.github/workflows/ci.yml

  security:
    name: Canonical security
    uses: ./.github/workflows/wolf-security-scan.yml

  docs:
    name: Canonical docs
    uses: ./.github/workflows/docs-hygiene.yml

  verification-summary:
    name: Manual verification summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ci, security, docs]
    if: always()
    steps:
      - name: Require every called workflow to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          required = {"ci", "security", "docs"}
          try:
              results = json.loads(os.environ["NEEDS_JSON"])
          except (KeyError, ValueError):
              sys.exit("::error::Missing or malformed workflow results")
          if not isinstance(results, dict) or set(results) != required:
              sys.exit("::error::Incomplete or unexpected workflow results")
          failed = [name for name in sorted(required)
                    if not isinstance(results[name], dict)
                    or results[name].get("result") != "success"]
          if failed:
              sys.exit("::error::Manual verification did not pass: " + ", ".join(failed))
          print("All called workflows passed. Canonical release receipts remain required.")
          PY
